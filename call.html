<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Service Tech" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>New call — Service Tech</title>
  <link rel="stylesheet" href="styles.css?v=34" />
</head>
<body>
  <div class="app">
  <header class="app-header">
    <a class="back" href="index.html" aria-label="Back">←</a>
    <h1>New call</h1>
  </header>

    <div class="stepper" role="tablist">
      <button type="button" class="step-pill active" data-step="open">Open</button>
      <button type="button" class="step-pill" data-step="readings">Readings</button>
      <button type="button" class="step-pill" data-step="mid">Mid</button>
      <button type="button" class="step-pill" data-step="close">Close</button>
    </div>

    <section id="panel-open">
      <div class="call-header" id="call-header">
        <label class="field"><span>Work order / customer #</span><input id="workOrder" autocomplete="off" /></label>
        <label class="field"><span>Tech name</span><input id="techName" autocomplete="name" placeholder="Remembered on this phone" /></label>
        <div class="row">
          <label class="field"><span>Start date</span><input id="startDate" type="date" /></label>
          <label class="field"><span>Start time</span><input id="startTime" type="time" /></label>
        </div>
      </div>
      <div id="scanned-summary" class="scanned-summary" hidden></div>
      <label class="field"><span>Site</span><input id="site" autocomplete="organization" placeholder="Store / address" /></label>
      <label class="field"><span>Equipment</span>
        <select id="equipment">
          <option value="cooler">cooler</option>
          <option value="freezer">freezer</option>
          <option value="RTU">RTU</option>
          <option value="split">split</option>
          <option value="mini-split">mini-split</option>
          <option value="rack">rack</option>
          <option value="other">other</option>
        </select>
      </label>
      <label class="field"><span>Symptom</span><textarea id="symptom" placeholder="What is the complaint?"></textarea></label>
      <label class="field"><span>Refrigerant</span><input id="refrigerant" placeholder="R-404A, R-448A, R-410A…" /></label>
      <div id="plate-scan-host"></div>
      <label class="field"><span>Data plate</span><textarea id="plate" placeholder="Model, serial, charge, RLA/LRA, MCA/MOP (scan or type)"></textarea></label>
      <div id="manuals-host" class="manuals"></div>
      <a class="btn btn-secondary" id="tree-link" href="tree.html">Troubleshooting steps</a>
      <label class="check"><input type="checkbox" id="photosReady" /> <span>Photos ready</span></label>
    </section>

    <section id="panel-readings" class="hidden">
      <div id="gauge-import-host"></div>
      <div class="row">
        <label class="field"><span>Suction pressure (psig)</span><input id="suctionPsig" inputmode="decimal" /></label>
        <label class="field"><span>Suction line temp (°F)</span><input id="suctionTemp" inputmode="decimal" /></label>
      </div>
      <div class="row">
        <label class="field"><span>Liquid pressure (psig)</span><input id="liquidPsig" inputmode="decimal" /></label>
        <label class="field"><span>Liquid line temp (°F)</span><input id="liquidTemp" inputmode="decimal" /></label>
      </div>
      <div id="shsc-inline" class="shsc-inline" role="status" aria-live="polite"></div>
      <div class="row">
        <label class="field"><span>Supply air (°F)</span><input id="supplyTemp" inputmode="decimal" /></label>
        <label class="field"><span>Return air (°F)</span><input id="returnTemp" inputmode="decimal" /></label>
      </div>
      <a class="btn btn-secondary" id="psy-link" href="psychro.html?from=call">Analyze in Psychrometrics →</a>
      <p class="footer-note" id="psy-link-note"></p>
      <div class="row">
        <label class="field"><span>Amps (A)</span><input id="amps" inputmode="decimal" /></label>
        <label class="field"><span>Plate RLA/FLA (A)</span><input id="fla" inputmode="decimal" /></label>
      </div>
      <div id="amps-pct" class="amps-pct" role="status" aria-live="polite"></div>
      <label class="field"><span>Voltage (V)</span><input id="voltage" inputmode="decimal" placeholder="L1-L2 / phases" /></label>
    </section>

    <section id="panel-mid" class="hidden">
      <label class="field"><span>Did</span><textarea id="did" placeholder="Actions taken"></textarea></label>
      <div class="phrase-chips" data-for="did" aria-label="Quick phrases for Did"></div>
      <label class="field"><span>Found</span><textarea id="found" placeholder="Findings"></textarea></label>
      <label class="field"><span>Still seeing</span><textarea id="stillSeeing" placeholder="What remains"></textarea></label>
    </section>

    <section id="panel-close" class="hidden">
      <label class="field"><span>Fixed</span><textarea id="fixed" placeholder="Resolution"></textarea></label>
      <div class="phrase-chips" data-for="fixed" data-set="close" aria-label="Resolution phrases for Fixed"></div>
      <div class="parts-list" id="parts-list">
        <h2 class="psy-h">Parts used</h2>
        <div id="parts-rows"></div>
        <button type="button" class="btn btn-secondary" id="parts-add">+ Add part</button>
      </div>
      <input type="hidden" id="partsList" />
      <input type="hidden" id="partsUsed" />
      <div class="row">
        <label class="field"><span>End date</span><input id="endDate" type="date" /></label>
        <label class="field"><span>End time</span><input id="endTime" type="time" /></label>
      </div>
      <p id="total-time" class="total-time" role="status"></p>
    </section>

    <button type="button" class="btn btn-copy" id="btn-copy">Copy for Service Tech</button>
    <div class="nav-row">
      <button type="button" class="btn btn-secondary" id="btn-prev">Back</button>
      <button type="button" class="btn btn-primary" id="btn-next">Next</button>
    </div>
    <p class="footer-note"><button type="button" class="btn btn-secondary" id="btn-reset" style="margin-top:12px">Clear draft</button></p>
  </div>
  <script src="version.js?v=34"></script>
  <script src="app.js?v=34"></script>
  <script type="module" src="tools/call-scan.js?v=34"></script>
  <script type="module" src="tools/call-gauge.js?v=34"></script>
  <script type="module" src="tools/call-wizard.js?v=34"></script>
</body>
</html>
